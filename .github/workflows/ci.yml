name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and tests
        run: python -m pip install '.[test]'
      - name: Compile and verify critical behavior
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '1'
        run: |
          python -m compileall -q sgep tests
          python -m pytest
          sgep --help
