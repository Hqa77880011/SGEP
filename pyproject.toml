[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgep"
version = "0.1.0"
description = "Spatially Grounded Evidential Prototypes for Open-Set Medical Image Recognition"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Qinao Hu"}]
dependencies = [
  "torch>=2.2,<3", "torchvision>=0.17,<1", "numpy>=1.26,<3",
  "scipy>=1.11,<2", "pandas>=2,<4", "scikit-learn>=1.4,<2",
  "Pillow>=10,<13", "matplotlib>=3.8,<4", "PyYAML>=6,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
sam = ["segment-anything @ git+https://github.com/facebookresearch/segment-anything.git@6fdee8f2727f4506cfbbe553e23b895e27956588", "opencv-python>=4.8,<5"]

[project.scripts]
sgep = "sgep.cli:main"

[project.urls]
Repository = "https://github.com/Hqa77880011/SGEP"

[tool.setuptools.packages.find]
include = ["sgep*"]

[tool.setuptools.package-data]
sgep = ["resources/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
